[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvescript"
version = "1.0.2"
description = "CLI and library framework for building, coding, testing, packaging and installing DaVinci Resolve scripts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
# pytest 9 needs Python >=3.10, so the floor stays low enough for 3.9: the
# resolver still picks the newest pytest the running interpreter allows.
dev = [
    "pytest>=7",
    "ruff>=0.16.10",
    "mypy>=1.8",
]
test = [
    "pytest>=7",
    "ruff>=0.16.10",
    "mypy>=1.8",
]

[project.scripts]
resolvescript = "ResolveScript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ResolveScript*"]

[tool.setuptools.package-data]
"ResolveScript" = ["templates/**/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "src/ResolveScript/templates",  # placeholders (@NAME@) are not valid Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "W", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ARG001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
# No python_version: each CI matrix leg type-checks against the stdlib it
# runs on (newer mypy also no longer accepts an EOL 3.9 target).
files = ["src/ResolveScript"]
# The framework is intentionally stdlib-only, but keep import following quiet
# for optional peers and for the placeholder-laden scaffold templates.
ignore_missing_imports = true
exclude = ["src/ResolveScript/templates"]
show_error_codes = true
warn_unused_configs = true