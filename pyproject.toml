[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvescript"
version = "1.0.2"
description = "CLI and library framework for building, coding, testing, packaging and installing DaVinci Resolve scripts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
# pytest 9 needs Python >=3.10, so the floor stays low enough for 3.9: the
# resolver still picks the newest pytest the running interpreter allows.
dev = [
    "pytest>=7",
    "ruff>=0.16.9",
]
test = [
    "pytest>=7",
    "ruff>=0.16.9",
]

[project.scripts]
resolvescript = "ResolveScript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ResolveScript*"]

[tool.setuptools.package-data]
"ResolveScript" = ["templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "src/ResolveScript/templates",  # placeholders (@NAME@) are not valid Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "W", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ARG001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]