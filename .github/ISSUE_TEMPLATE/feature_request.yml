name: Feature request
description: Suggest an idea for resolvescript
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting. Please search existing issues and `TODO.md` first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does your feature solve? Be specific about your workflow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include example commands or manifest snippets if relevant.
      render: console
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or other approaches have you considered?
    validations:
      required: false