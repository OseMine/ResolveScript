# Security scanning workflow
# Runs daily and on PR to catch vulnerabilities early

name: Security Scan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Scan (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security scan
        uses: ./.github/actions/security-scan
        with:
          project-dir: "."
          fail-on-critical: true
          fail-on-high: false

      # Security reports uploaded as artifacts by security-scan action
      # pip-audit JSON is not valid SARIF, so we skip SARIF upload