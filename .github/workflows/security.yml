# Thin security gate - copy into any project, wire OpenAI/Puter/VirusTotal
# secrets, done. Trivy + cargo/npm/pip audit + VirusTotal scan + AI review,
# rating 0-10, fails the run below min-rating.
name: Security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: OseMine/workflows/.github/actions/build@bc8c4cd87e4dc0f0c4ba0dca63bdd44aa48f2f28 # v2
        with:
          language: python
          build: python
          output-dir: dist

      - uses: OseMine/workflows/.github/actions/security@bc8c4cd87e4dc0f0c4ba0dca63bdd44aa48f2f28 # v2
        with:
          min-rating: "7"
          provider: opencode
          model: auto-free
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          fallback-provider: opencode
          fallback-model: auto-free
          fallback-api-key: ${{ secrets.OPENCODE_API_KEY }}
          virustotal-api-key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          virustotal-files: "dist/*"