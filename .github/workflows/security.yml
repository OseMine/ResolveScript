# Thin security gate - copy into any project, wire OpenAI/Puter/VirusTotal
# secrets, done. Trivy + cargo/npm/pip audit + VirusTotal scan + AI review,
# rating 0-10, fails the run below min-rating.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: OseMine/workflows/.github/actions/security@v2
        with:
          min-rating: "7"
          provider: opencode          # opencode | google | openai | mistral | anthropic | x | deepseek | groq | puter | ollama
          model: auto-free
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          fallback-provider: opencode
          fallback-model: auto-free
          fallback-api-key: ${{ secrets.OPENCODE_API_KEY }}
          # --- custom OpenAI-compatible API (optional, replaces provider/model above) ---
          # provider: custom
          # model: my-model            # model id your API accepts
          # custom-api-base: https://api.example.com/v1
          # custom-api-key: ${{ secrets.CUSTOM_API_KEY }}
          virustotal-api-key: ${{ secrets.VIRUSTOTAL_API_KEY }} # optional (VIRUSTOTAL badge)
          virustotal-files: "dist/*.exe *.exe" # space-separated globs
          test-cmd: "python -m pytest"       # optional verification