# Security scanning workflow
# Runs daily and on PR to catch vulnerabilities early

name: Security Scan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # hashFiles() is only legal in a step-level `if:` — as a job-level condition
  # GitHub rejects the whole file — and it would be empty before checkout anyway.
  # So the "is this a project?" check lives in a gate job: no manifest at the
  # root means this workflow belongs to a scaffolded project, and the jobs skip.
  manifest:
    name: Manifest check
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for a manifest
        id: check
        run: |
          if [ -f manifest.json ] || [ -f manifest.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Security Scan (Python ${{ matrix.python-version }})
    needs: manifest
    if: needs.manifest.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install security tools
        run: pip install pip-audit safety bandit

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip-audit --format=json --output=pip-audit.json || true
          pip-audit --desc --format=text

      - name: Run safety (dependency vulnerabilities)
        run: |
          safety check --json --output=safety.json || true
          safety check

      - name: Run bandit (code security)
        run: |
          bandit -r . -f json -o bandit.json || true
          bandit -r . -f txt

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            pip-audit.json
            safety.json
            bandit.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          if [[ -f pip-audit.json ]]; then
            critical=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' pip-audit.json)
            if [[ $critical -gt 0 ]]; then
              echo "::error::Found $critical critical vulnerabilities"
              exit 1
            fi
          fi

      - name: Check for high vulnerabilities
        run: |
          if [[ -f pip-audit.json ]]; then
            high=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' pip-audit.json)
            if [[ $high -gt 0 ]]; then
              echo "::error::Found $high high vulnerabilities"
              exit 1
            fi
          fi

      # Security reports uploaded as artifacts
      # pip-audit JSON is not valid SARIF, so we skip SARIF upload