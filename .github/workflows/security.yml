# Security scanning workflow
# Runs daily and on PR to catch vulnerabilities early

name: Security Scan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Scan (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install security tools
        run: pip install pip-audit safety bandit

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip-audit --format=json --output=pip-audit.json || true
          pip-audit --desc --format=text

      - name: Run safety (dependency vulnerabilities)
        run: |
          safety check --json --output=safety.json || true
          safety check

      - name: Run bandit (code security)
        run: |
          bandit -r . -f json -o bandit.json || true
          bandit -r . -f txt

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit.json
            safety.json
            bandit.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          if [[ -f pip-audit.json ]]; then
            critical=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' pip-audit.json)
            if [[ $critical -gt 0 ]]; then
              echo "::error::Found $critical critical vulnerabilities"
              exit 1
            fi
          fi

      - name: Check for high vulnerabilities
        run: |
          if [[ -f pip-audit.json ]]; then
            high=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' pip-audit.json)
            if [[ $high -gt 0 ]]; then
              echo "::error::Found $high high vulnerabilities"
              exit 1
            fi
          fi

      # Security reports uploaded as artifacts
      # pip-audit JSON is not valid SARIF, so we skip SARIF upload