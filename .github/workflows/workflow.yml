# Example Workflow Integration CI workflow
# Copy this to your workflow integration project's .github/workflows/workflow.yml

name: Workflow Integration CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # hashFiles() is only legal in a step-level `if:` — as a job-level condition
  # GitHub rejects the whole file — and it would be empty before checkout anyway.
  # So the "is this a project?" check lives in a gate job: no manifest at the
  # root means this workflow belongs to a scaffolded project, and the jobs skip.
  manifest:
    name: Manifest check
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for a manifest
        id: check
        run: |
          if [ -f manifest.json ] || [ -f manifest.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  workflow:
    name: Workflow Integration (Python ${{ matrix.python-version }})
    needs: manifest
    if: needs.manifest.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.py
            **/setup.cfg

      - name: Install ResolveScript
        run: pip install ResolveScript

      - name: Build Workflow Integration
        run: resolvescript workflow build --script-only

      - name: Test
        run: resolvescript test -q --tb=short

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: workflow-${{ matrix.python-version }}
          path: dist/*
          retention-days: 30

  # Full build with Electron (runs on specific schedule or manual)
  workflow-electron:
    name: Workflow Integration (with Electron)
    needs: manifest
    if: >-
      needs.manifest.outputs.present == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Install ResolveScript
        run: pip install ResolveScript

      - name: Install Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2 libpangocairo-1.0-0 libpango-1.0-0 libcairo2 libatspi2.0-0

      - name: Build Workflow Integration (with Electron)
        run: resolvescript workflow build

      - name: Upload Electron Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: workflow-electron
          path: dist/*
          retention-days: 30