# Thin CI workflow — copy into any project. Set `language` (or a repo
# variable `CI_LANGUAGE`) and done. All lint/check/test logic lives in the
# shared `ci` action and updates automatically at @v2.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: OseMine/workflows/.github/actions/ci@v2
        with:
          language: python