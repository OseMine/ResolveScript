# Example CI workflow using ResolveScript composite actions
# Copy this to your project's .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: ResolveScript CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.py
            **/setup.cfg

      - name: Install ResolveScript
        run: pip install ResolveScript

      - name: Analyze
        if: hashFiles('manifest.json') != '' || hashFiles('manifest.xml') != ''
        run: |
          if [ -f manifest.json ] || [ -f manifest.xml ]; then
            resolvescript analyze
          else
            echo "No manifest at root, skipping analyze"
          fi

      - name: Build
        run: resolvescript build

      - name: Test
        run: resolvescript test -q --tb=short