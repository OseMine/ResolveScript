# Example CI workflow using ResolveScript composite actions
# Copy this to your project's .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: ResolveScript CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ResolveScript CI
        uses: ./.github/actions/ci
        with:
          project-dir: "."
          python-version: ${{ matrix.python-version }}
          resolvescript-version: "latest"
          run-build: true
          run-test: true
          run-analyze: true
          run-package: false
          test-args: "-q --tb=short"