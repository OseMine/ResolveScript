# Dependency check workflow
# Runs weekly to report outdated dependencies

name: Dependency Check

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9 AM UTC
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # hashFiles() is only legal in a step-level `if:` — as a job-level condition
  # GitHub rejects the whole file — and it would be empty before checkout anyway.
  # So the "is this a project?" check lives in a gate job: no manifest at the
  # root means this workflow belongs to a scaffolded project, and the jobs skip.
  manifest:
    name: Manifest check
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for a manifest
        id: check
        run: |
          if [ -f manifest.json ] || [ -f manifest.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  deps:
    name: Dependency Check (Python ${{ matrix.python-version }})
    needs: manifest
    if: needs.manifest.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install check tools
        run: pip install pipdeptree pip-licenses

      - name: Check outdated packages
        run: |
          echo "## Outdated packages"
          pip list --outdated --format=json | jq -r '.[] | "\(.name): \(.version) -> \(.latest_version)"' || true

      - name: Check licenses
        run: |
          echo "## License report"
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=table

          # Check for disallowed licenses
          ALLOWED="MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,Python-2.0"
          disallowed=$(jq -r --arg allowed "$ALLOWED" '
            .[] | select(.License | split(";") | map(. | gsub("^\\s+|\\s+$";"")) | any(. | IN($allowed | split(",")) | not)) | "\(.Name): \(.License)"
          ' licenses.json)
          if [[ -n "$disallowed" ]]; then
            echo "::error::Disallowed licenses found:"
            echo "$disallowed"
            exit 1
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

      - name: Dependency tree
        run: |
          echo "## Dependency tree"
          pipdeptree --json | jq -r '.[] | "\(.package.key): \(.package.installed_version)"' | head -50

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the artifact
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const licenseArtifact = artifacts.data.artifacts.find(a => a.name === 'license-report');
            if (licenseArtifact) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: licenseArtifact.id,
                archive_format: 'zip'
              });
              
              // Parse and comment
              // Note: This would need actual implementation
              console.log('License report artifact found');
            }