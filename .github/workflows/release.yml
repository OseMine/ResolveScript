# Thin release workflow - copy into any project, set `language` + optional
# `build` flags. Everything (meta/semver, builds, security gate, AI release
# notes, release + SHA256SUMS) lives in the shared `release-all` action.
#
# -- Pin vs rolling tag policy --------------------------------------
#   @v2      stable - receives non-breaking fixes; recommended for production
#   @latest  rolling - latest published state; friendly to new features
#   @main    branch head - bleeding edge; only for testing
#
# Primary trigger: workflow_dispatch (Actions tab -> Run workflow).
# Version is auto-detected from pubspec.yaml / Cargo.toml / package.json, or
# overridden via the `version` input. Tag push (`v*`) remains supported as a
# secondary trigger.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3). Empty = auto-detect from project files"
        required: false
        type: string
      version-file:
        description: "File to detect version from (e.g. pyproject.toml). Empty = auto-detect from project files"
        default: "pyproject.toml"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      VERSION_FILE: ${{ github.event.inputs.version-file || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: OseMine/workflows/.github/actions/release-all@v2
        with:
          language: python            # auto | rust | tauri | node | python | flutter | kmp | c | cpp | csharp | maven | gradle
          build: ${{ github.event.inputs.build || 'python' }}
          release-tag: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || '' }}
          min-rating: "7"             # security gate 0-10; 0 disables
          draft: ${{ github.event.inputs.draft || 'false' }}
          prerelease: ${{ github.event.inputs.prerelease || 'false' }}

          # -- AI provider for the SECURITY GATE --------------------
          provider: opencode          # opencode | google | openai | mistral | anthropic | x | deepseek | groq | puter | ollama
          model: auto-free
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          fallback-provider: opencode
          fallback-model: auto-free
          fallback-api-key: ${{ secrets.OPENCODE_API_KEY }}

          # -- AI provider for RELEASE NOTES (overrides above) -----
          notes-mode: auto            # auto | file | ai-required
          notes-file: CHANGELOG.md    # used only when AI fails (auto mode)
          notes-provider: opencode
          notes-model: auto-free
          notes-api-key: ${{ secrets.OPENCODE_API_KEY }}
          notes-fallback-provider: mistral
          notes-fallback-model: auto-free
          notes-fallback-api-key: ${{ secrets.MISTRAL_API_KEY }}

      - name: Publish to PyPI (trusted publishing)
        if: true
        uses: OseMine/workflows/.github/actions/pypi-publish@v2