# Example Release workflow using ResolveScript composite actions
# Copy this to your project's .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ResolveScript
        uses: ./.github/actions/setup-resolvescript
        with:
          python-version: "3.9"
          resolvescript-version: "latest"

      - name: Analyze
        uses: ./.github/actions/analyze
        with:
          project-dir: "."

      - name: Build
        uses: ./.github/actions/build
        with:
          project-dir: "."
          installable: false

      - name: Test
        uses: ./.github/actions/test
        with:
          project-dir: "."
          test-args: "-q --tb=short"

      - name: Package
        uses: ./.github/actions/package
        with:
          project-dir: "."
          dist-dir: "dist"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false