# Release workflow for the ResolveScript package itself
# Publishes to PyPI and creates GitHub Release

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.py
            **/setup.cfg

      - name: Install dependencies
        # Build isolation picks a setuptools that supports the running Python —
        # pinning one here breaks 3.9 (newer drops it) and 3.12 (a forced
        # stdlib distutils is gone from the stdlib).
        run: pip install -e .[test]

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --tb=short

      - name: Build
        run: |
          pip install build
          python -m build --wheel --sdist

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    name: Publish to PyPI
    needs: [build-and-test, release]
    # Skipped until PyPI trusted publishing (OIDC) is configured for this repo
    # *and* the PYPI_PUBLISH repository variable is set to "true" — otherwise
    # every release would end red on an OIDC exchange PyPI does not recognise.
    # Configure the publisher on pypi.org under the project's publishing
    # settings, then flip Settings → Secrets and variables → Actions → Variables.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Requires PyPI trusted publishing configured (OIDC)