# Enhanced Release workflow
# Triggered on version tags, does full build/test/security/package/release

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag must match vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

  build-test:
    name: Build & Test (Python ${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.py
            **/setup.cfg

      - name: Install ResolveScript
        run: pip install ResolveScript

      - name: Analyze
        if: hashFiles('manifest.json') != '' || hashFiles('manifest.xml') != ''
        run: |
          if [ -f manifest.json ] || [ -f manifest.xml ]; then
            resolvescript analyze
          else
            echo "No manifest at root, skipping analyze"
          fi

      - name: Build
        if: hashFiles('manifest.json') != '' || hashFiles('manifest.xml') != ''
        run: resolvescript build

      - name: Test
        if: hashFiles('manifest.json') != '' || hashFiles('manifest.xml') != ''
        run: resolvescript test -q --tb=short

      - name: Upload build artifacts
        if: hashFiles('manifest.json') != '' || hashFiles('manifest.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  security:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install security tools
        run: pip install pip-audit safety bandit

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip-audit --format=json --output=pip-audit.json || true
          pip-audit --desc --format=text

      - name: Run safety (dependency vulnerabilities)
        run: |
          safety check --json --output=safety.json || true
          safety check

      - name: Run bandit (code security)
        run: |
          bandit -r . -f json -o bandit.json || true
          bandit -r . -f txt

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit.json
            safety.json
            bandit.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          if [[ -f pip-audit.json ]]; then
            critical=$(jq '[.vulnerabilities[] | select(.severity == "critical")] | length' pip-audit.json)
            if [[ $critical -gt 0 ]]; then
              echo "::error::Found $critical critical vulnerabilities"
              exit 1
            fi
          fi

      - name: Check for high vulnerabilities
        run: |
          if [[ -f pip-audit.json ]]; then
            high=$(jq '[.vulnerabilities[] | select(.severity == "high")] | length' pip-audit.json)
            if [[ $high -gt 0 ]]; then
              echo "::error::Found $high high vulnerabilities"
              exit 1
            fi
          fi

  deps:
    name: Dependency Check
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install check tools
        run: pip install pipdeptree pip-licenses

      - name: Check outdated packages
        run: |
          echo "## Outdated packages"
          pip list --outdated --format=json | jq -r '.[] | "\(.name): \(.version) -> \(.latest_version)"' || true

      - name: Check licenses
        run: |
          echo "## License report"
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=table

          # Check for disallowed licenses
          ALLOWED="MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,Python-2.0"
          disallowed=$(jq -r --arg allowed "$ALLOWED" '
            .[] | select(.License | split(";") | map(. | gsub("^\\s+|\\s+$";"")) | any(. | IN($allowed | split(",")) | not)) | "\(.Name): \(.License)"
          ' licenses.json)
          if [[ -n "$disallowed" ]]; then
            echo "::error::Disallowed licenses found:"
            echo "$disallowed"
            exit 1
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

      - name: Dependency tree
        run: |
          echo "## Dependency tree"
          pipdeptree --json | jq -r '.[] | "\(.package.key): \(.package.installed_version)"' | head -50

  package:
    name: Package Release Artifacts
    needs: [build-test, security, deps]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist/
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ResolveScript
        run: pip install ResolveScript

      - name: Package
        run: resolvescript package --dist dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*.zip
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [validate, build-test, security, deps, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Publish to PyPI
  pypi-publish:
    name: Publish to PyPI
    needs: [release]
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Requires PyPI trusted publishing configured