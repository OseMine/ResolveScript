# Enhanced Release workflow
# Triggered on version tags, does full build/test/security/package/release

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string
      draft:
        description: "Create as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Tag must match vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

  build-test:
    name: Build & Test (Python ${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ResolveScript
        uses: ./.github/actions/setup-resolvescript
        with:
          python-version: ${{ matrix.python-version }}

      - name: Analyze
        uses: ./.github/actions/analyze

      - name: Build
        uses: ./.github/actions/build
        with:
          project-dir: "."
          installable: false

      - name: Test
        uses: ./.github/actions/test
        with:
          project-dir: "."
          test-args: "-q --tb=short"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.python-version }}
          path: dist/
          retention-days: 7

  security:
    name: Security Scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          project-dir: "."
          fail-on-critical: true
          fail-on-high: true

      # Security reports uploaded as artifacts by security-scan action
      # pip-audit JSON is not valid SARIF, so we skip SARIF upload

  deps:
    name: Dependency Check
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency check
        uses: ./.github/actions/dependency-check
        with:
          project-dir: "."
          check-outdated: true
          check-licenses: true

  package:
    name: Package Release Artifacts
    needs: [build-test, security, deps]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist/
          merge-multiple: true

      - name: Package
        uses: ./.github/actions/package
        with:
          project-dir: "."
          dist-dir: "dist"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: dist/*.zip
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [validate, build-test, security, deps, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Publish to PyPI
  pypi-publish:
    name: Publish to PyPI
    needs: [release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Requires PyPI trusted publishing configured