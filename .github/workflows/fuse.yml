# Example Fuse CI workflow using ResolveScript composite actions
# Copy this to your fuse project's .github/workflows/fuse.yml

name: Fuse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # hashFiles() is only legal in a step-level `if:` — as a job-level condition
  # GitHub rejects the whole file — and it would be empty before checkout anyway.
  # So the "is this a Fuse project?" check lives in a gate job: no manifest at
  # the root means this is not a Fuse project, and the build jobs skip.
  manifest:
    name: Manifest check
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for a manifest
        id: check
        run: |
          if [ -f manifest.json ] || [ -f manifest.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  fuse:
    name: Fuse (Python ${{ matrix.python-version }})
    needs: manifest
    if: needs.manifest.outputs.present == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.py
            **/setup.cfg

      - name: Install ResolveScript
        run: pip install ResolveScript

      - name: Build Fuse
        run: resolvescript fuse build

      - name: Test Fuse
        run: resolvescript fuse describe

      - name: Package Fuse
        run: resolvescript fuse package

      - name: Upload Fuse Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuse-${{ matrix.python-version }}
          path: dist/*
          retention-days: 30

