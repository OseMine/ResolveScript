name: "ResolveScript Update"
description: "Re-resolve recorded dependencies within their version ranges"
author: "ResolveScript"

inputs:
  name:
    description: "Update only this specific dependency"
    required: false
  scripts-root:
    description: "Override OS-detected Scripts root"
    required: false
  precise:
    description: "Pin an exact version"
    required: false
  fix:
    description: "Realign installed versions to manifest compat"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Update dependencies
      shell: bash
      run: |
        cmd="resolvescript update"
        if [[ -n "${{ inputs.name }}" ]]; then
          cmd="$cmd '${{ inputs.name }}'"
        fi
        if [[ -n "${{ inputs.scripts-root }}" ]]; then
          cmd="$cmd --scripts-root '${{ inputs.scripts-root }}'"
        fi
        if [[ -n "${{ inputs.precise }}" ]]; then
          cmd="$cmd --precise '${{ inputs.precise }}'"
        fi
        if [[ "${{ inputs.fix }}" == "true" ]]; then
          cmd="$cmd --fix"
        fi
        echo "Running: $cmd"
        eval $cmd