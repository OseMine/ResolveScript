name: "ResolveScript Fuse"
description: "Build, install, and package Fusion fuses (.fuse plugins)"
author: "ResolveScript"

inputs:
  subcommand:
    description: "Fuse subcommand (build, install, package, list, uninstall, root, describe)"
    required: true
  project-dir:
    description: "Project directory (for build, install, package, describe)"
    required: false
    default: "."
  entrypoint:
    description: "Fuse entrypoint (e.g., my_pkg.fuse:FUSE)"
    required: false
  root:
    description: "Override Fuses/Plugins directory"
    required: false
  dist:
    description: "Output directory for package"
    required: false
    default: "dist"
  plugin:
    description: "Prebuilt .plugin to include in package"
    required: false
  dry-run:
    description: "Report without writing"
    required: false
    default: "false"
  no-check:
    description: "Skip validation"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run fuse command
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        cmd="resolvescript fuse ${{ inputs.subcommand }}"
        if [[ -n "${{ inputs.entrypoint }}" ]]; then
          cmd="$cmd --entrypoint '${{ inputs.entrypoint }}'"
        fi
        if [[ -n "${{ inputs.root }}" ]]; then
          cmd="$cmd --root '${{ inputs.root }}'"
        fi
        if [[ "${{ inputs.subcommand }}" == "package" && -n "${{ inputs.dist }}" ]]; then
          cmd="$cmd --dist '${{ inputs.dist }}'"
        fi
        if [[ "${{ inputs.subcommand }}" == "package" && -n "${{ inputs.plugin }}" ]]; then
          cmd="$cmd --plugin '${{ inputs.plugin }}'"
        fi
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          cmd="$cmd --dry-run"
        fi
        if [[ "${{ inputs.no-check }}" == "true" ]]; then
          cmd="$cmd --no-check"
        fi
        echo "Running: $cmd"
        eval $cmd

    - name: Upload fuse artifacts
      if: inputs.subcommand == 'build' || inputs.subcommand == 'package'
      uses: actions/upload-artifact@v4
      with:
        name: resolvescript-fuse-${{ inputs.subcommand }}
        path: ${{ inputs.project-dir }}/${{ inputs.dist }}/*
        retention-days: 30