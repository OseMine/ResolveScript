name: "ResolveScript Dependency Check"
description: "Check for outdated dependencies and license compliance"
author: "ResolveScript"

inputs:
  project-dir:
    description: "Project directory"
    required: false
    default: "."
  check-outdated:
    description: "Check for outdated packages"
    required: false
    default: "true"
  check-licenses:
    description: "Check license compatibility"
    required: false
    default: "true"
  allowed-licenses:
    description: "Comma-separated list of allowed SPDX licenses"
    required: false
    default: "MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,Python-2.0"

runs:
  using: "composite"
  steps:
    - name: Setup ResolveScript
      uses: ./.github/actions/setup-resolvescript

    - name: Install check tools
      shell: bash
      run: |
        pip install pipdeptree pip-licenses

    - name: Check outdated packages
      if: inputs.check-outdated == 'true'
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        echo "## Outdated packages"
        pip list --outdated --format=json | jq -r '.[] | "\(.name): \(.version) -> \(.latest_version)"' || true

    - name: Check licenses
      if: inputs.check-licenses == 'true'
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        echo "## License report"
        pip-licenses --format=json --output-file=licenses.json
        pip-licenses --format=table

        # Check for disallowed licenses
        ALLOWED="${{ inputs.allowed-licenses }}"
        disallowed=$(jq -r --arg allowed "$ALLOWED" '
          .[] | select(.License | split(";") | map(. | gsub("^\\s+|\\s+$";"")) | any(. | IN($allowed | split(",")) | not)) | "\(.Name): \(.License)"
        ' licenses.json)
        if [[ -n "$disallowed" ]]; then
          echo "::error::Disallowed licenses found:"
          echo "$disallowed"
          exit 1
        fi

    - name: Upload license report
      if: inputs.check-licenses == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: ${{ inputs.project-dir }}/licenses.json
        retention-days: 30

    - name: Dependency tree
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        echo "## Dependency tree"
        pipdeptree --json | jq -r '.[] | "\(.package.key): \(.package.installed_version)"' | head -50