name: "ResolveScript Plugin"
description: "Deploy compiled Fusion plugins (.plugin) — never builds them"
author: "ResolveScript"

inputs:
  subcommand:
    description: "Plugin subcommand (install, describe, list, uninstall, root)"
    required: true
  path:
    description: "Path to .plugin file/bundle (for install, describe)"
    required: false
  root:
    description: "Override Plugins directory"
    required: false
  name:
    description: "Name to install under (for install)"
    required: false
  dry-run:
    description: "Report without copying"
    required: false
    default: "false"
  no-force:
    description: "Fail if target already exists"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run plugin command
      shell: bash
      run: |
        cmd="resolvescript plugin ${{ inputs.subcommand }}"
        if [[ -n "${{ inputs.path }}" ]]; then
          cmd="$cmd '${{ inputs.path }}'"
        fi
        if [[ -n "${{ inputs.root }}" ]]; then
          cmd="$cmd --root '${{ inputs.root }}'"
        fi
        if [[ -n "${{ inputs.name }}" ]]; then
          cmd="$cmd --name '${{ inputs.name }}'"
        fi
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          cmd="$cmd --dry-run"
        fi
        if [[ "${{ inputs.no-force }}" == "true" ]]; then
          cmd="$cmd --no-force"
        fi
        echo "Running: $cmd"
        eval $cmd