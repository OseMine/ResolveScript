name: "ResolveScript Workflow"
description: "Build and install Workflow Integrations (Workspace > Workflow Integrations)"
author: "ResolveScript"

inputs:
  subcommand:
    description: "Workflow subcommand (build, install, install-script, install-plugin, list, uninstall, root, describe)"
    required: true
  project-dir:
    description: "Project directory"
    required: false
    default: "."
  entrypoint:
    description: "Integration entrypoint (e.g., my_pkg.workflow:INTEGRATION)"
    required: false
  root:
    description: "Override Workflow Integration Plugins directory"
    required: false
  dist:
    description: "Output directory for build"
    required: false
    default: "dist"
  script-only:
    description: "Skip Electron shell"
    required: false
    default: "false"
  dry-run:
    description: "Report without writing"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run workflow command
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        cmd="resolvescript workflow ${{ inputs.subcommand }}"
        if [[ -n "${{ inputs.entrypoint }}" ]]; then
          cmd="$cmd --entrypoint '${{ inputs.entrypoint }}'"
        fi
        if [[ -n "${{ inputs.root }}" ]]; then
          cmd="$cmd --root '${{ inputs.root }}'"
        fi
        if [[ "${{ inputs.subcommand }}" == "build" && -n "${{ inputs.dist }}" ]]; then
          cmd="$cmd --out '${{ inputs.dist }}'"
        fi
        if [[ "${{ inputs.script-only }}" == "true" ]]; then
          cmd="$cmd --script-only"
        fi
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          cmd="$cmd --dry-run"
        fi
        echo "Running: $cmd"
        eval $cmd

    - name: Upload workflow artifacts
      if: inputs.subcommand == 'build'
      uses: actions/upload-artifact@v4
      with:
        name: resolvescript-workflow-build
        path: ${{ inputs.project-dir }}/${{ inputs.dist }}/*
        retention-days: 30