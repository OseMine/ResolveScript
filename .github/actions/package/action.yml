name: "ResolveScript Package"
description: "Assemble release artifacts (zip, checksums) for a ResolveScript project"
author: "ResolveScript"

inputs:
  project-dir:
    description: "Directory containing the project"
    required: false
    default: "."
  dist-dir:
    description: "Output directory for package artifacts"
    required: false
    default: "dist"

runs:
  using: "composite"
  steps:
    - name: Package project
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        cmd="resolvescript package --dist '${{ inputs.dist-dir }}'"
        echo "Running: $cmd"
        eval $cmd

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: resolvescript-package-${{ inputs.project-dir }}
        path: ${{ inputs.project-dir }}/${{ inputs.dist-dir }}/*
        retention-days: 30