name: "ResolveScript CI"
description: "Full CI pipeline: setup, build, test, analyze"
author: "ResolveScript"

inputs:
  project-dir:
    description: "Directory containing the project"
    required: false
    default: "."
  python-version:
    description: "Python version"
    required: false
    default: "3.9"
  resolvescript-version:
    description: "ResolveScript version"
    required: false
    default: "latest"
  run-build:
    description: "Run build step"
    required: false
    default: "true"
  run-test:
    description: "Run test step"
    required: false
    default: "true"
  run-analyze:
    description: "Run analyze step"
    required: false
    default: "true"
  run-package:
    description: "Run package step"
    required: false
    default: "false"
  test-args:
    description: "Additional pytest arguments"
    required: false
    default: "-q"
  installable:
    description: "Generate Lua installer instead of Python file"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup ResolveScript
      uses: ./.github/actions/setup-resolvescript
      with:
        python-version: ${{ inputs.python-version }}
        resolvescript-version: ${{ inputs.resolvescript-version }}

    - name: Analyze
      if: inputs.run-analyze == 'true'
      uses: ./.github/actions/analyze
      with:
        project-dir: ${{ inputs.project-dir }}

    - name: Build
      if: inputs.run-build == 'true'
      uses: ./.github/actions/build
      with:
        project-dir: ${{ inputs.project-dir }}
        installable: ${{ inputs.installable }}

    - name: Test
      if: inputs.run-test == 'true'
      uses: ./.github/actions/test
      with:
        project-dir: ${{ inputs.project-dir }}
        test-args: ${{ inputs.test-args }}

    - name: Package
      if: inputs.run-package == 'true'
      uses: ./.github/actions/package
      with:
        project-dir: ${{ inputs.project-dir }}